# Packaging-only manifest staged beside executables built from Q's two modules.
# Wails v3.1 YAML packaging is explicitly opted in by desktopbuild; this does
# not select the experimental purego GUI backend unless -purego is requested.
version: 3
project:
  name: q-studio
  product_name: Q Studio
  identifier: ne.saturday.q-studio
  binary_name: q-studio
  kind: gui
  version: 0.0.2
  company: Q contributors
  description: Workspace coding agent
  icon: assets/icon.png
frontend:
  disabled: true
build:
  output: bin
binaries:
  q-engine:
    package: .
    kind: cli
packages:
  nsis:
    template: support/windows-wails.nsi
  deb:
    template: support/nfpm.yaml
  rpm:
    template: support/nfpm.yaml
