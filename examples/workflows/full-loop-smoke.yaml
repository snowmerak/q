# Engine smoke: command-only graph (no live LLM).
version: 1
name: full-loop-smoke
entry: a
limits:
  max_visits: 6
steps:
  a:
    type: command
    command: echo A-SMOKE-OK
  b:
    type: command
    command: echo B-SMOKE-OK
edges:
  - { from: a, to: b, when: always }
  - { from: b, to: end, when: always }
sinks:
  end: { type: success }
