version: "3"

tasks:
  default:
    desc: Install q and q-mcp
    cmds:
      - task: install

  install:
    desc: Install q and q-mcp into the Go binary directory
    cmds:
      - go install ./cmd/q ./cmd/q-mcp

  build:
    desc: Build q and q-mcp into ./bin
    cmds:
      - go build -o ./bin/ ./cmd/q ./cmd/q-mcp

  desktop:build:
    desc: Build Q Studio and its bundled q engine into ./bin/studio and a portable archive
    cmds:
      - go run ./scripts/desktopbuild {{.CLI_ARGS}}

  desktop:package:
    desc: Build installable Q Studio packages with pinned Wails (Windows EXE, macOS DMG, Linux DEB/RPM)
    cmds:
      - go run ./scripts/desktopbuild -installer {{.CLI_ARGS}}

  desktop:check:
    desc: Test and vet the isolated Q Studio desktop module
    dir: desktop
    env: { GOWORK: "off" }
    cmds:
      - go test ./...
      - go vet ./...

  ci:check:
    desc: Check desktop release signing and infrastructure retry behavior
    cmds:
      - node --test scripts/ci/studio-retry.test.mjs
      - node --test scripts/ci/macos-release.test.mjs

  studio:install:
    desc: Install the pinned Q Studio frontend dependencies
    cmds:
      - npm --prefix ./studio/frontend ci

  studio:build:
    desc: Build the versioned Q Studio frontend assets
    cmds:
      - npm --prefix ./studio/frontend run build

  studio:check:
    desc: Check Q Studio types and verify that embedded frontend assets are current
    cmds:
      - npm --prefix ./studio/frontend run check
      - npm --prefix ./studio/frontend run build
      - git diff --exit-code -- ./studio/frontend/dist

  studio:test:
    desc: Run browser regression tests against an isolated Studio and local model fixture
    cmds:
      - npm --prefix ./studio/frontend run test:e2e

  run:
    desc: Run q from source
    interactive: true
    cmds:
      - go run ./cmd/q {{.CLI_ARGS}}

  test:
    desc: Test q and both nested ACP modules, generated bindings, and Studio types
    cmds:
      - go test ./...
      - go -C third_party/acp-go-sdk test ./...
      - go -C third_party/acp-go-sdk/cmd/generate test ./...
      - task: acp:check
      - npm --prefix ./studio/frontend run check

  acp:generate:
    desc: Regenerate ACP bindings from pinned schemas and Q's overlay
    cmds:
      - go -C third_party/acp-go-sdk/cmd/generate run .

  acp:check:
    desc: Verify ACP bindings match the schemas without modifying files
    cmds:
      - go -C third_party/acp-go-sdk/cmd/generate run . -check

  dist:check:
    desc: Install snapshot modules through an isolated local proxy with GOWORK off
    cmds:
      - go run ./scripts/modulecheck
