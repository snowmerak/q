version: "3"

tasks:
  web:install:
    desc: Install frontend dependencies from lockfile
    cmds:
      - pnpm --dir web install --frozen-lockfile

  web:typecheck:
    desc: Run TypeScript typecheck on web/
    cmds:
      - pnpm --dir web typecheck

  web:test:
    desc: Run Vitest unit tests in web/
    cmds:
      - pnpm --dir web test

  web:build:
    desc: Build web/dist bundle for Go //go:embed
    cmds:
      - pnpm --dir web build

  build:q:
    desc: Build unified q server CLI binary (embeds web/dist)
    deps:
      - web:build
    cmds:
      - go build -o bin/q{{exeExt}} ./cmd/q

  build:llm-provider:
    desc: Build standalone llm-provider CLI binary
    cmds:
      - go build -o bin/llm-provider{{exeExt}} ./cmd/llm-provider

  build:cdp-q-driver:
    desc: Build standalone cdp-q-driver CLI binary
    cmds:
      - go build -o bin/cdp-q-driver{{exeExt}} ./cmd/cdp-q-driver

  build:desktop:
    desc: Build Wails v3 desktop shell binary (embeds web/dist via pkg/app)
    deps:
      - web:build
    dir: desktop
    cmds:
      - cmd: go build {{if eq OS "windows"}}-ldflags "-H windowsgui" {{end}}-o ../bin/q-desktop{{exeExt}} .

  package:windows:
    desc: Build and package Windows NSIS installer via makensis
    deps:
      - build:desktop
    cmds:
      - mkdir -p bin/nsis
      - wails3 generate webview2bootstrapper -dir bin/nsis
      - makensis desktop/packaging/windows-wails.nsi

  package:darwin:
    desc: Stage macOS .app bundle contents using desktop/packaging/darwin-Info.plist
    deps:
      - build:desktop
    cmds:
      - mkdir -p bin/Q.app/Contents/MacOS bin/Q.app/Contents/Resources
      - cp bin/q-desktop bin/Q.app/Contents/MacOS/q-desktop
      - cp desktop/packaging/darwin-Info.plist bin/Q.app/Contents/Info.plist
      - cp desktop/packaging/icons.icns bin/Q.app/Contents/Resources/icons.icns

  package:linux:
    desc: Package Linux DEB and RPM bundles using desktop/packaging/nfpm.yaml
    deps:
      - build:desktop
    dir: desktop/packaging
    cmds:
      - nfpm pkg -p deb -f nfpm.yaml -t ../../bin/
      - nfpm pkg -p rpm -f nfpm.yaml -t ../../bin/

  build:all:
    desc: Build all Q v2 CLI and desktop binaries
    deps:
      - build:q
      - build:llm-provider
      - build:cdp-q-driver
      - build:desktop

  test:go:
    desc: Run Go unit and integration tests
    cmds:
      - go test ./...

  test:desktop:
    desc: Run desktop shell Go tests
    dir: desktop
    cmds:
      - go test ./...

  test:all:
    desc: Run frontend and Go checks and tests
    deps:
      - web:typecheck
      - web:test
      - test:desktop
    cmds:
      - go vet ./...
      - go test ./...

  dev:server:
    desc: Start q v2 server in development mode
    cmds:
      - go run ./cmd/q serve

  dev:web:
    desc: Start Vite development server (proxies /api to 127.0.0.1:17070)
    cmds:
      - pnpm --dir web dev
