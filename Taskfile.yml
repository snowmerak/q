version: "3"

tasks:
  default:
    desc: Install q and q-mcp
    cmds:
      - task: install

  install:
    desc: Install q and q-mcp into the Go binary directory
    cmds:
      - go install ./cmd/q ./cmd/q-mcp

  build:
    desc: Build q and q-mcp into ./bin
    cmds:
      - go build -o ./bin/ ./cmd/q ./cmd/q-mcp

  run:
    desc: Run q from source
    interactive: true
    cmds:
      - go run ./cmd/q {{.CLI_ARGS}}

  test:
    desc: Test q and both nested ACP modules, including generated binding drift
    cmds:
      - go test ./...
      - go -C third_party/acp-go-sdk test ./...
      - go -C third_party/acp-go-sdk/cmd/generate test ./...
      - task: acp:check

  acp:generate:
    desc: Regenerate ACP bindings from pinned schemas and Q's overlay
    cmds:
      - go -C third_party/acp-go-sdk/cmd/generate run .

  acp:check:
    desc: Verify ACP bindings match the schemas without modifying files
    cmds:
      - go -C third_party/acp-go-sdk/cmd/generate run . -check

  dist:check:
    desc: Install snapshot modules through an isolated local proxy with GOWORK off
    cmds:
      - go run ./scripts/modulecheck
