name: Retry Q Studio infrastructure failures

on:
  workflow_run:
    workflows: [Q Studio desktop release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: studio-desktop-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      # workflow_run is privileged. Never execute the failed run's source.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify retry policy
        run: node --test scripts/ci/studio-retry.test.mjs
      - name: Retry recognized infrastructure failures with backoff
        run: node scripts/ci/studio-retry.mjs
        env:
          GH_TOKEN: ${{ github.token }}
